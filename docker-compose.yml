services:
  # --------------------
  # BACKEND SERVICE (FastAPI)
  # --------------------
  backend:
    image: dz-stagia-backend
    build:
      context: ./backend      # Assumes Dockerfile is in ./backend/
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app         # Sync local backend code with container's /app
      - /app/venv              # Optional: Exclude the container's virtual environment
    ports:
      - "8000:8000"
    environment:
      # The backend connects to the cloud database using the connection string
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@cloud-host:5432/dz_stagiaire_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_secret_key_here}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-your_email@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-your_app_password}

  # --------------------
  # FRONTEND SERVICE (React)
  # --------------------
  frontend:
    build:
      context: ./frontend      # Points to the frontend folder
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app        # Syncs only the frontend folder to /app
      - /app/node_modules      # Keeps container dependencies isolated
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true           # Important for interactive mode
    tty: true
    depends_on:
      - backend