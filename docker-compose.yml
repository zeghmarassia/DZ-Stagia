services:
  # --------------------
  # 1. DATABASE SERVICE (PostgreSQL)
  # --------------------
  db:
    image: postgres:16-alpine  # Lightweight official PostgreSQL image
    restart: always
    environment:
      # These variables are required for PostgreSQL initialization
      POSTGRES_USER: dz_user
      POSTGRES_PASSWORD: dz_password
      POSTGRES_DB: dz_stagiaire_db
    ports:
      # Expose port 5432 on host for optional direct access (e.g., with DBeaver)
      - "5432:5432"
    volumes:
      # Persistent volume to store database data
      - postgres_data:/var/lib/postgresql/data

  # --------------------
  # 2. BACKEND SERVICE (FastAPI)
  # --------------------
  backend:
    build:
      context: ./backend      # Assumes Dockerfile is in ./backend/
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app         # Sync local backend code with container's /app
      - /app/venv              # Optional: Exclude the container's virtual environment
    ports:
      - "8000:8000"
    environment:
      # The backend connects to the DB using the 'db' service name
      DATABASE_URL: postgresql://dz_user:dz_password@db:5432/dz_stagiaire_db
    depends_on:
      - db                     # Ensure the database is running before starting the backend

  # --------------------
  # 3. FRONTEND SERVICE (React)
  # --------------------
  frontend:
    build:
      context: ./frontend      # Points to the frontend folder
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app        # Syncs only the frontend folder to /app
      - /app/node_modules      # Keeps container dependencies isolated
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true           # Important for interactive mode
    tty: true
    depends_on:
      - backend

# --------------------
# NAMED VOLUMES
# --------------------
volumes:
  # This named volume will hold your PostgreSQL data persistently
  postgres_data: